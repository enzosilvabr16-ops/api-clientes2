
services:
  mysql:
    image: mysql:8.4
    container_name: api-clientes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: coti
      MYSQL_DATABASE: bd-clientes
      MYSQL_USER: coti
      MYSQL_PASSWORD: coti
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rede-clientes
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcoti"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: api-clientes-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "5052:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rede-clientes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mysql_data:

networks:
  rede-clientes:
    driver: bridge
